name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Android project
        run: |
          test -f settings.gradle.kts || { echo "::error::Missing settings.gradle.kts. Upload extracted Android project files to repository root."; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::Missing app/build.gradle.kts."; exit 1; }
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPSMonitor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
